name: cookieclicker
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.0
  device_preview: ^1.1.0  # Add this line for DevicePreview support

  cupertino_icons: ^1.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/cookieBowl.jpg
    - assets/images/betterCursor.png
    - assets/images/backroom.jpg
    - assets/trophy/million.png
    - assets/fonts/Bloodsoul.ttf

  fonts:
    - family: Bloodsoul
      fonts:
        - asset: assets/fonts/Bloodsoul.ttf
